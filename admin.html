<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Astro Pandit Admin</title><style>
*{box-sizing:border-box}body{margin:0;font:15px system-ui,sans-serif;background:#f4f1ff;color:#241a4a}header{background:#1b1633;color:#fff;padding:14px 16px;font-weight:700;font-size:18px}
nav{display:flex;overflow:auto;background:#fff;border-bottom:1px solid #ddd}nav button{flex:none;border:0;background:none;padding:14px 16px;font:inherit;color:#6b6290}nav button.on{color:#ff4f79;border-bottom:3px solid #ff4f79;font-weight:700}
main{padding:14px;max-width:680px;margin:auto}.c{background:#fff;border-radius:14px;padding:14px;margin:10px 0;box-shadow:0 1px 4px #0001}label{display:block;font-size:12px;color:#6b6290;margin:8px 0 2px}
input,select,textarea{width:100%;padding:10px;border:1px solid #cfc7ee;border-radius:10px;font:inherit;background:#fff}.b{background:#ff4f79;color:#fff;border:0;border-radius:10px;padding:12px 16px;font:inherit;font-weight:700;margin:6px 6px 0 0}.b.g{background:#e8e2ff;color:#241a4a}.b.r{background:#fde4e4;color:#b00020}
.t{display:flex;align-items:center;gap:8px;margin-top:8px}.t input{width:auto}.ok{color:#0a7d4f;font-weight:700}</style></head><body><header>✨ Astro Pandit Admin</header>
<div id="lg" style="padding:14px"><div class="c"><label>GitHub repo (owner/name)</label><input id="rp" value="drsharmag/risingstars-legal"><label>Access token (stays in this browser only)</label><input id="tk" type="password"><button class="b" onclick="login()">Open</button><p id="er" style="color:#b00020"></p></div></div>
<div id="ap" hidden><nav id="nv"></nav><main id="v"></main></div>
<script>
var C={},SHA=null,R='',TK='';function $(i){return document.getElementById(i)}
function gh(m,b){return fetch('https://api.github.com/repos/'+R+'/contents/config.json',{method:m,headers:{Authorization:'Bearer '+TK,Accept:'application/vnd.github+json'},body:b?JSON.stringify(b):undefined})}
function dec(s){return decodeURIComponent(escape(atob(s.replace(/\n/g,''))))}function enc(s){return btoa(unescape(encodeURIComponent(s)))}
function fix(){C.ads=C.ads||[];C.set=C.set||{};if(typeof C.banner!=='object'||!C.banner)C.banner={text:C.banner||'',on:!!C.banner};C.muhurat=C.muhurat||[];C.daily=C.daily||{};C.i18n=C.i18n||{}}
function login(){R=$('rp').value.trim();TK=$('tk').value.trim();gh('GET').then(function(r){if(r.status==404){C={};SHA=null;return}if(!r.ok)throw 0;return r.json().then(function(j){SHA=j.sha;C=JSON.parse(dec(j.content))})}).then(function(){localStorage.rp=R;localStorage.tk=TK;fix();$('lg').hidden=true;$('ap').hidden=false;go('sp')}).catch(function(){$('er').textContent='Could not open. Check the repo name and token.'})}
if(localStorage.tk){$('rp').value=localStorage.rp||$('rp').value;$('tk').value=localStorage.tk}
function save(m){m.textContent='Saving...';gh('PUT',{message:'Admin update',content:enc(JSON.stringify(C,null,1)),sha:SHA||undefined}).then(function(r){if(!r.ok)return r.json().then(function(e){throw new Error(r.status+': '+(e.message||''))});return r.json()}).then(function(j){SHA=j.content.sha;m.textContent='Saved. Live in the app in about 5 minutes.';m.className='ok'}).catch(function(e){m.textContent='Could not save. '+(e&&e.message||'')+' (403 or 404 means the token cannot write: make a new token with Contents = Read and write.)';m.className=''})}
function go(t){var T=[['sp','Sponsors'],['set','Settings'],['mu','Muhurat'],['hr','Horoscopes'],['bc','Message'],['tr','Translations'],['js','Full edit']];$('nv').innerHTML='';T.forEach(function(x){var b=document.createElement('button');b.textContent=x[1];b.className=x[0]==t?'on':'';b.onclick=function(){go(x[0])};$('nv').appendChild(b)});var v=$('v');v.innerHTML='';({sp:sp,set:set,mu:mu,hr:hr,bc:bc,tr:tr,js:js})[t](v)}
function el(p,h){var d=document.createElement('div');d.className='c';d.innerHTML=h||'';p.appendChild(d);return d}
function fld(p,l,o,k,type){var a=document.createElement('label');a.textContent=l;var i=document.createElement(type=='area'?'textarea':'input');if(type=='area')i.rows=3;else if(type)i.type=type;i.value=o[k]==null?'':o[k];i.oninput=function(){o[k]=type=='number'?+i.value:i.value};p.appendChild(a);p.appendChild(i)}
function tog(p,l,o,k,def){var d=document.createElement('div');d.className='t';var i=document.createElement('input');i.type='checkbox';i.checked=o[k]==null?def:!!o[k];i.onchange=function(){o[k]=i.checked};d.appendChild(i);d.appendChild(document.createTextNode(l));p.appendChild(d)}
function bar(v,add){var m=document.createElement('p');if(add){var a=document.createElement('button');a.className='b g';a.textContent=add[0];a.onclick=add[1];v.appendChild(a)}var s=document.createElement('button');s.className='b';s.textContent='Save all';s.onclick=function(){save(m)};v.appendChild(s);v.appendChild(m)}
function sp(v){C.ads.forEach(function(a,i){var c=el(v);fld(c,'Company',a,'co');fld(c,'Title',a,'title');fld(c,'Text',a,'text','area');fld(c,'Button text',a,'cta');fld(c,'Link (https://...)',a,'link');tog(c,'Show this sponsor',a,'on',true);var d=document.createElement('button');d.className='b r';d.textContent='Delete';d.onclick=function(){C.ads.splice(i,1);go('sp')};c.appendChild(d)});bar(v,['+ Add sponsor',function(){C.ads.push({co:'',title:'',text:'',cta:'Open',link:'https://',on:true});go('sp')}])}
function set(v){var c=el(v,'<b>Announcement banner</b>');fld(c,'Message at the top of the Today screen',C.banner,'text','area');tog(c,'Show banner',C.banner,'on',false);var d=el(v,'<b>App settings</b>');fld(d,'Daily notification hour (0-23)',C.set,'notifHour','number');tog(d,'Show the Ask AI tab',C.set,'chatOn',false);fld(d,'AI server address (leave empty if none)',C,'api');var e=el(v,'<b>Full-screen ads</b>');C.set.adp=C.set.adp||{};tog(e,'After Gun Milan',C.set.adp,'gun',true);tog(e,'After FLAMES',C.set.adp,'flames',true);tog(e,'After Kundali',C.set.adp,'kundli',true);tog(e,'After Rashi finder',C.set.adp,'rashi',true);fld(e,'Minimum minutes between full-screen ads',C.set,'adGap','number');var g=el(v,'<b>AdMob (paste your ad unit IDs here)</b><br>Looks like ca-app-pub-1234/5678. Keep the switch off until Play Store approves the app.');tog(g,'Use live ads (otherwise Google test ads)',C.set,'adsLive',false);fld(g,'Rewarded ad unit ID',C.set,'admobR');fld(g,'Full-screen (interstitial) ad unit ID',C.set,'admobI');fld(g,'Banner ad unit ID',C.set,'admobB');tog(g,'Show banner ad at the bottom',C.set,'banner',false);var p=el(v,'<b>Ask Panditji</b>');tog(p,'Show the Ask Panditji tab',C.set,'pandit',true);fld(p,'WhatsApp number with country code, digits only (example 919876543210)',C.set,'wa');bar(v)}
function bc(v){var c=el(v,'<b>Send a message to all users</b><br>It appears as a notification on each phone the next time the app is opened or brought to the screen.');var o={title:'',body:''};fld(c,'Title',o,'title');fld(c,'Message',o,'body','area');var m=document.createElement('p'),b=document.createElement('button');b.className='b';b.textContent='Send now';b.onclick=function(){if(!o.body)return alert('Write a message first.');C.set.bc={id:Date.now(),title:o.title,body:o.body,on:true};save(m)};c.appendChild(b);c.appendChild(m)}
function mu(v){C.muhurat.forEach(function(a,i){var c=el(v);fld(c,'Type (Vivah, Griha Pravesh, Vehicle, Business, Namkaran)',a,'cat');fld(c,'Date',a,'date','date');fld(c,'Note (time or source)',a,'note');var d=document.createElement('button');d.className='b r';d.textContent='Delete';d.onclick=function(){C.muhurat.splice(i,1);go('mu')};c.appendChild(d)});bar(v,['+ Add date',function(){C.muhurat.push({cat:'Vivah',date:'',note:''});go('mu')}])}
function hr(v){var c=el(v,'<b>Write a horoscope for a day</b>');var o={},f=document.createElement('div'),dt=document.createElement('input');dt.type='date';dt.value=new Date().toISOString().slice(0,10);var ss=document.createElement('select');'Aries,Taurus,Gemini,Cancer,Leo,Virgo,Libra,Scorpio,Sagittarius,Capricorn,Aquarius,Pisces'.split(',').forEach(function(s){ss.innerHTML+='<option>'+s+'</option>'});c.appendChild(dt);c.appendChild(ss);c.appendChild(f);
function ld(){C.daily[dt.value]=C.daily[dt.value]||{};o=C.daily[dt.value][ss.value]=C.daily[dt.value][ss.value]||{};f.innerHTML='';fld(f,'Love',o,'love','area');fld(f,'Work',o,'work','area');fld(f,'Love (Hindi)',o,'love_hi','area');fld(f,'Work (Hindi)',o,'work_hi','area');fld(f,'Lucky number',o,'num','number');fld(f,'Lucky color',o,'col')}
dt.onchange=ld;ss.onchange=ld;ld();bar(v)}
function tr(v){var c=el(v,'<b>Translations</b><br>Pick a language code (hi, mr, gu, ta, te, bn). Edit the JSON: left side is the English word, right side is the translation.');var sel=document.createElement('select');['hi','mr','gu','ta','te','bn'].forEach(function(x){sel.innerHTML+='<option>'+x+'</option>'});var ta=document.createElement('textarea');ta.rows=14;function ld(){ta.value=JSON.stringify(C.i18n[sel.value]||{"Today":"","Tomorrow":"","Kundali":"","Match":"","Muhurat":"","Ask":""},null,1)}ta.oninput=function(){try{C.i18n[sel.value]=JSON.parse(ta.value)}catch(e){}};sel.onchange=ld;ld();c.appendChild(sel);c.appendChild(ta);bar(v)}
function js(v){var c=el(v,'<b>Full edit</b><br>Every setting of the app in one place. Be careful with commas and quotes.');var ta=document.createElement('textarea');ta.rows=22;ta.style.fontFamily='monospace';ta.value=JSON.stringify(C,null,1);ta.oninput=function(){try{C=JSON.parse(ta.value);fix()}catch(e){}};c.appendChild(ta);bar(v)}
</script></body></html>
